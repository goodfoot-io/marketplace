name: Plugin Layout Checks

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: packages/plugin-layout-checks/registry/plugins.json

jobs:
  layout-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The changelog gate reads each plugin's version history from git log
          # on its versionSurfaces.source. At this action's default depth of 1
          # that history is one commit, and check-changelog-entry.mjs now
          # refuses rather than pass a tree it cannot verify — so this job needs
          # the full history to do its work at all.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install pinned Antigravity CLI
        run: |
          set -euo pipefail
          AGY_VERSION="1.1.21"
          AGY_URL="https://storage.googleapis.com/antigravity-public/antigravity-cli/1.1.21-6424454201475072/linux-x64/cli_linux_x64.tar.gz"
          AGY_SHA512="3de7552ef089c136c0f570cdc9c04652278e02c1d41ed3911ad5f9f1b8c3bd567643aa401a1916060ea32a1b17fbaf90cbb417071db33f467880fcd848868d92"
          archive="$(mktemp)"
          extract_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location "$AGY_URL" --output "$archive"
          printf '%s  %s\n' "$AGY_SHA512" "$archive" | sha512sum --check
          tar -xzf "$archive" -C "$extract_dir" antigravity
          install -m 0755 "$extract_dir/antigravity" "$HOME/.local/bin/agy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          test "$(agy --version)" = "$AGY_VERSION"

      - name: Run tri-platform layout checks
        run: yarn workspace @goodfoot/plugin-layout-checks test

      # Every path below comes from the registry and has no other source, so a
      # plugin that is in the registry is a plugin CI diffs. "Adds a plugin but
      # forgets to add its paths" is not a reachable state.
      - name: Verify generated agent skills are fresh
        run: |
          set -euo pipefail
          yarn build:agent-skills
          mapfile -t trees < <(jq -r '.plugins[].targets[].path' "$REGISTRY")
          test "${#trees[@]}" -gt 0 || { echo "registry declares no trees" >&2; exit 1; }
          git diff --exit-code -- "${trees[@]}"

      # The bundler's own portability linter, over the same --root, --target,
      # and --platform-dir flags the build derives from the registry. It shipped
      # with agent-skills and nothing invoked it, so seven plugins migrated onto
      # the bundler without a single rule it implements ever being enforced.
      - name: Lint agent skill templates
        run: yarn lint:agent-skills

      - name: Verify plugin versions are in lockstep
        run: ./scripts/sync-plugin-versions.sh --check

      # Both literals here stay goodfoot-scoped. ./skills is the shared OpenCode
      # root that no migrated plugin targets, and ./plugins-claude/agent-skills is the
      # companion plugin's own Claude path.
      - name: Validate Claude skills trees
        run: |
          set -euo pipefail
          yarn claude --version
          for root in ./skills ./plugins-claude/agent-skills; do
            manifest="$(find "$root" -type f -name SKILL.md -size +0c -print -quit)"
            test -n "$manifest" || { echo "$root: contains no non-empty SKILL.md" >&2; exit 1; }
          done
          yarn claude plugin validate ./plugins-claude/agent-skills

      - name: Validate Claude plugin roots
        run: |
          set -euo pipefail
          mapfile -t roots < <(jq -r '.plugins[].claudePluginRoot' "$REGISTRY")
          test "${#roots[@]}" -gt 0 || { echo "registry declares no plugin roots" >&2; exit 1; }
          for root in "${roots[@]}"; do
            echo "::group::validate $root"
            yarn claude plugin validate "./$root"
            echo "::endgroup::"
          done

      # Antigravity support is target-driven during the migration: until a
      # plugin declares a target there is intentionally nothing to validate.
      # Once it does, validate the complete plugin root (including its owned
      # plugin.json), and require evidence that at least one category was
      # actually processed. agy exits successfully for skipped categories, so
      # exit status alone cannot distinguish a valid tree from an empty shape.
      - name: Validate Antigravity plugin roots
        run: |
          set -euo pipefail
          mapfile -t roots < <(jq -r '.plugins[] | select(any(.targets[]?; .platform == "antigravity")) | .antigravityPluginRoot' "$REGISTRY")
          if test "${#roots[@]}" -eq 0; then
            echo "registry declares no Antigravity plugin roots; skipping validation"
            exit 0
          fi
          command -v agy >/dev/null 2>&1 || { echo "unsupported runner: pinned agy CLI is unavailable" >&2; exit 1; }
          agy --version
          for root in "${roots[@]}"; do
            test -f "$root/plugin.json" || { echo "$root: missing plugin.json" >&2; exit 1; }
            echo "::group::antigravity validate $root"
            output="$(agy plugin validate "$root" 2>&1)"
            printf '%s\n' "$output"
            grep -Eq 'skills[[:space:]]*: [1-9][0-9]* processed' <<< "$output" || {
              echo "$root: validation processed no skills" >&2
              exit 1
            }
            echo "::endgroup::"
          done

      - name: Claude install smoke
        run: |
          set -euo pipefail
          checkout="$(pwd)"
          claude_cli="$(yarn bin claude)"
          before_status="$(git status --porcelain=v1 --untracked-files=all)"
          smoke_home="$(mktemp -d)"
          smoke_project="$(mktemp -d)"
          trap 'rm -rf "$smoke_home" "$smoke_project"' EXIT
          export HOME="$smoke_home"
          export CLAUDE_CONFIG_DIR="$smoke_home/.claude"
          cd "$smoke_project"
          test ! -e "$CLAUDE_CONFIG_DIR/plugins/known_marketplaces.json" || {
            echo "scratch config unexpectedly contains marketplace state" >&2
            exit 1
          }
          node "$claude_cli" plugin marketplace add "$checkout"
          mapfile -t names < <(jq -r '.plugins[].name' "$checkout/.claude-plugin/marketplace.json")
          test "${#names[@]}" -eq 10 || { echo "marketplace must declare exactly ten Claude plugins" >&2; exit 1; }
          for name in "${names[@]}"; do
            echo "::group::claude install $name"
            node "$claude_cli" plugin install "$name@goodfoot"
            node "$claude_cli" plugin list --json | jq -e --arg name "$name@goodfoot" \
              'any(.[]; .id == $name)' >/dev/null
            node "$claude_cli" plugin uninstall "$name@goodfoot"
            node "$claude_cli" plugin list --json | jq -e --arg name "$name@goodfoot" \
              'all(.[]; .id != $name)' >/dev/null
            echo "::endgroup::"
          done
          node "$claude_cli" plugin marketplace remove goodfoot
          cd "$checkout"
          after_status="$(git status --porcelain=v1 --untracked-files=all)"
          test "$after_status" = "$before_status" || {
            echo "Claude smoke mutated the checkout" >&2
            diff <(printf '%s\n' "$before_status") <(printf '%s\n' "$after_status") || true
            exit 1
          }
          if test "${GITHUB_ACTIONS:-}" = true; then
            git diff --exit-code
          fi

      # The assertion is re-derived from the same registry entry that drove the
      # install, and anchored to that plugin's own subtree. A bare skill-name
      # predicate would be worse than useless here: two plugins in the roster
      # ship a skill named `cli`, so `-path '*/skills/cli/SKILL.md'` can pass in
      # a home holding both while proving nothing about which one installed.
      - name: Codex install smoke
        run: |
          set -euo pipefail
          command -v codex >/dev/null 2>&1 || { echo "unsupported runner: pinned codex CLI is unavailable" >&2; exit 1; }
          codex --version
          mapfile -t entries < <(jq -r '.plugins[] | select(.marketplace.codex != null) | [.marketplace.codex, (.skills | join(","))] | @tsv' "$REGISTRY")
          test "${#entries[@]}" -gt 0 || { echo "registry declares no Codex marketplace plugins" >&2; exit 1; }
          for entry in "${entries[@]}"; do
            name="${entry%%$'\t'*}"
            skills="${entry#*$'\t'}"
            echo "::group::codex add $name"
            smoke_home="$(mktemp -d)"
            HOME="$smoke_home" codex plugin marketplace add .agents/plugins/marketplace.json
            HOME="$smoke_home" codex plugin add "$name"

            skills_dir="$(find "$smoke_home" -type d -path "*/$name/skills" -print -quit)"
            test -n "$skills_dir" || { echo "$name: installed no skills directory" >&2; exit 1; }

            # Assert the plugin's whole declared skill list, not one
            # representative, so a partial install is caught.
            IFS=',' read -ra declared <<< "$skills"
            for skill in "${declared[@]}"; do
              manifest="$skills_dir/$skill/SKILL.md"
              test -f "$manifest" || { echo "$name: missing $skill/SKILL.md" >&2; exit 1; }
              test ! -L "$manifest" || { echo "$name: $skill/SKILL.md is a symlink" >&2; exit 1; }
            done

            installed="$(find "$skills_dir" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd,)"
            expected="$(printf '%s\n' "${declared[@]}" | sort | paste -sd,)"
            test "$installed" = "$expected" || {
              echo "$name: installed skills [$installed] != declared [$expected]" >&2
              exit 1
            }

            HOME="$smoke_home" codex plugin remove "$name" || true
            rm -rf "$smoke_home"
            echo "::endgroup::"
          done

      # The only enforcement anywhere in CI of OpenCode's name-format
      # requirement. Generated from the registry so a newly registered root is
      # a checked root.
      - name: OpenCode boot smoke
        run: |
          set -euo pipefail
          command -v opencode >/dev/null 2>&1 || { echo "unsupported runner: pinned OpenCode CLI is unavailable" >&2; exit 1; }
          opencode --version
          # Every OpenCode-rendered tree, registered or not: the name-format
          # requirement is a property of the rendered output, so an unregistered
          # tree that will be registered later must not go unchecked until then.
          mapfile -t roots < <(jq -r '.plugins[].targets[] | select(.platform == "opencode") | .path' "$REGISTRY")
          test "${#roots[@]}" -gt 0 || { echo "registry declares no OpenCode trees" >&2; exit 1; }
          for root in "${roots[@]}"; do
            echo "::group::opencode names in $root"
            mapfile -t manifests < <(find "$root" -name SKILL.md)
            test "${#manifests[@]}" -gt 0 || { echo "$root: no SKILL.md found" >&2; exit 1; }
            for manifest in "${manifests[@]}"; do
              grep -Eq "^name: [a-z0-9]+(-[a-z0-9]+)*$" "$manifest" || {
                echo "$manifest: name is not lowercase kebab-case" >&2
                exit 1
              }
            done
            echo "::endgroup::"
          done
