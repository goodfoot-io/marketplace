name: Plugin Layout Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  layout-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tri-platform layout checks
        run: yarn workspace @goodfoot/plugin-layout-checks test

      - name: Verify generated agent skills are fresh
        run: yarn build:agent-skills && git diff --exit-code -- skills plugins-claude/goodfoot/skills plugins-codex/goodfoot/skills plugins-opencode/goodfoot/skills

      - name: Validate Claude skills tree (strict)
        run: |
          yarn claude --version
          yarn claude plugin validate ./skills --strict
          yarn claude plugin validate ./plugins/agent-skills --strict

      - name: Validate Claude goodfoot plugin
        run: |
          yarn claude plugin validate ./plugins-claude/goodfoot

      - name: Claude install smoke
        run: |
          smoke_home="$(mktemp -d)"
          trap 'rm -rf "$smoke_home"' EXIT
          HOME="$smoke_home" yarn claude plugin marketplace add .
          HOME="$smoke_home" yarn claude plugin install goodfoot@goodfoot
          HOME="$smoke_home" yarn claude plugin details goodfoot@goodfoot
          HOME="$smoke_home" yarn claude plugin uninstall goodfoot@goodfoot
          HOME="$smoke_home" yarn claude plugin marketplace remove .

      - name: Codex install smoke
        run: |
          command -v codex >/dev/null 2>&1 || { echo "unsupported runner: pinned codex CLI is unavailable" >&2; exit 1; }
          codex --version
          smoke_home="$(mktemp -d)"
          trap 'rm -rf "$smoke_home"' EXIT
          HOME="$smoke_home" codex plugin marketplace add .agents/plugins/marketplace.json
          HOME="$smoke_home" codex plugin add goodfoot
          installed_skill="$(find "$smoke_home" -path '*/skills/documentation/SKILL.md' -print -quit)"
          test -n "$installed_skill"
          test -f "$installed_skill"
          test ! -L "$installed_skill"

      - name: OpenCode boot smoke
        run: |
          command -v opencode >/dev/null 2>&1 || { echo "unsupported runner: pinned OpenCode CLI is unavailable" >&2; exit 1; }
          opencode --version
          find plugins-opencode/goodfoot/skills -name SKILL.md -print0 | xargs -0 -n1 sh -c 'grep -Eq "^name: [a-z0-9]+(-[a-z0-9]+)*$" "$0"'
