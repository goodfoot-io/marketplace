<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__REALTIME_VOICE_TITLE__</title>
    <style>
      :root {
        --bg-base: #09090b;
        --bg-card: #18181b;
        --border: #27272a;
        --text-dim: #52525b;
        --text-muted: #71717a;
        --text-default: #a1a1aa;
        --text-bright: #e4e4e7;
        --text-white: #fafafa;
        --accent: #22d3ee;
        --role-user: #a78bfa;
        --role-assistant: #34d399;
        --role-system: #fb923c;
        --role-tool: #60a5fa;
        --state-error: #f87171;
        --dot-connected: #22c55e;
        --dot-connecting: #eab308;
        --dot-disconnected: #52525b;
        --dot-error: #f87171;
        --font-sans: "Geist", "Inter", system-ui, -apple-system, sans-serif;
        --font-mono: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        min-height: 100dvh;
        margin: 0;
        background: var(--bg-base);
        color: var(--text-default);
        font-family: var(--font-sans);
      }

      button,
      textarea,
      select {
        font: inherit;
      }

      button:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      .tool-call:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .layout {
        width: 100%;
        max-width: 680px;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .header {
        display: none;
        height: 0;
        padding: 0;
        border-bottom: 1px solid var(--border);
        background: var(--bg-base);
        position: sticky;
        top: 0;
        z-index: 10;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .title {
        color: var(--text-bright);
        font-size: 14px;
        font-weight: 500;
      }

      .connection {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-muted);
        font-family: var(--font-mono);
        font-size: 11px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dot-disconnected);
      }

      .dot.connected {
        background: var(--dot-connected);
      }

      .dot.connecting {
        background: var(--dot-connecting);
      }

      .dot.error {
        background: var(--dot-error);
      }

      .controls {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-shrink: 0;
      }

      .field-label {
        color: var(--text-muted);
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .mic-note,
      .input-hint {
        color: var(--text-muted);
        font-size: 12px;
        font-style: italic;
      }

      select {
        width: 100%;
        appearance: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-bright);
        padding: 6px 10px;
        font-size: 13px;
      }

      .buttons,
      .input-row,
      .meters {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .buttons {
        min-width: 0;
      }

      .settings {
        position: relative;
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .icon-btn {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
      }

      .icon-btn:hover {
        color: var(--text-bright);
        border-color: #3f3f46;
      }

      .settings-menu {
        position: absolute;
        right: 0;
        top: 40px;
        z-index: 20;
        width: min(320px, calc(100vw - 32px));
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-card);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }

      .primary,
      .reset,
      .retry {
        height: 32px;
        padding: 0 14px;
        border-radius: 6px;
        cursor: pointer;
        transition:
          opacity 150ms,
          transform 80ms,
          color 150ms,
          border-color 150ms,
          background 150ms;
      }

      .primary {
        border: none;
        background: var(--accent);
        color: #000;
        font-size: 13px;
        font-weight: 500;
      }

      .primary.pause {
        background: var(--bg-card);
        color: var(--text-bright);
        border: 1px solid var(--border);
      }

      .primary.resume {
        background: rgba(34, 211, 238, 0.1);
        border: 1px solid rgba(34, 211, 238, 0.3);
        color: var(--accent);
      }

      .primary:disabled,
      .send-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .reset {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        font-size: 13px;
      }

      .reset:hover {
        border-color: #3f3f46;
        color: var(--state-error);
      }

      button:active:enabled {
        transform: scale(0.97);
      }

      .meters {
        height: 16px;
        align-items: flex-end;
      }

      .bar {
        width: 2px;
        height: 16px;
        border-radius: 2px;
        background: rgba(34, 211, 238, 0.6);
        transform: scaleY(var(--level, 0.1));
        transform-origin: bottom;
        transition: transform 50ms linear;
      }

      .transcript {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .empty-state,
      .ended-state,
      .duplicate-page {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        color: var(--text-muted);
      }

      .empty-icon {
        width: 32px;
        height: 32px;
        opacity: 0.5;
      }

      .transcript-item {
        padding: 8px 12px;
        border-radius: 0 6px 6px 0;
        color: var(--text-bright);
        font-size: 14px;
        line-height: 1.55;
        word-break: break-word;
      }

      .transcript-item.streaming {
        opacity: 1;
      }

      .role-user {
        border-left: 2px solid var(--role-user);
      }

      .role-assistant {
        border-left: 2px solid var(--role-assistant);
      }

      .role-system {
        border-left: 2px solid var(--role-system);
        background: rgba(251, 146, 60, 0.06);
        color: rgba(251, 146, 60, 0.85);
        font-size: 13px;
        font-style: italic;
      }

      .source-textInput {
        background: rgba(167, 139, 250, 0.04);
      }

      .source-system.role-user,
      .source-system.role-assistant {
        border-left-style: dashed;
        color: var(--text-default);
      }

      .source-firstMessage {
        position: relative;
        border: 1px solid rgba(167, 139, 250, 0.25);
        background: rgba(167, 139, 250, 0.06);
        border-radius: 6px;
        padding-right: 110px;
      }

      .source-firstMessage::after {
        content: "first message";
        position: absolute;
        top: 6px;
        right: 8px;
        color: var(--text-dim);
        font-family: var(--font-mono);
        font-size: 10px;
      }

      .tool-call {
        background: rgba(96, 165, 250, 0.07);
        border: 1px solid rgba(96, 165, 250, 0.18);
        border-radius: 6px;
        padding: 7px 10px;
        font-family: var(--font-mono);
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }

      .tool-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .badge {
        border-radius: 4px;
        padding: 2px 7px;
        background: rgba(52, 211, 153, 0.12);
        color: #34d399;
        font-size: 11px;
      }

      .badge.started {
        background: rgba(251, 191, 36, 0.15);
        color: #fbbf24;
      }

      .badge.failed {
        background: rgba(248, 113, 113, 0.12);
        color: #f87171;
      }

      .badge.interrupted {
        background: rgba(161, 161, 170, 0.12);
        color: #71717a;
      }

      .tool-call-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 220ms ease-out;
      }

      .tool-call.expanded .tool-call-body {
        max-height: var(--body-height);
      }

      .section-label {
        margin: 10px 0 4px;
        color: var(--text-dim);
        font-size: 11px;
        letter-spacing: 0.08em;
      }

      pre {
        margin: 0 0 8px;
        padding: 8px;
        overflow-x: auto;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.25);
        color: var(--text-default);
        white-space: pre-wrap;
        word-break: break-all;
      }

      .input-bar {
        flex-shrink: 0;
        border-top: 1px solid var(--border);
        background: var(--bg-base);
        padding: 10px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      textarea {
        flex: 1;
        min-height: 36px;
        max-height: 120px;
        resize: none;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-card);
        color: var(--text-bright);
        padding: 8px 12px;
        font-size: 14px;
        line-height: 1.5;
      }

      textarea:focus {
        border-color: rgba(34, 211, 238, 0.4);
      }

      textarea::placeholder {
        color: var(--text-dim);
      }

      .send-btn {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #000;
        cursor: pointer;
      }

      .send-btn:disabled {
        background: var(--bg-card);
        color: var(--text-dim);
      }

      .error-block {
        background: rgba(248, 113, 113, 0.07);
        border: 1px solid rgba(248, 113, 113, 0.2);
        border-radius: 6px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .error-title {
        color: var(--state-error);
        font-size: 13px;
        font-weight: 600;
      }

      .retry {
        height: 28px;
        border: 1px solid rgba(248, 113, 113, 0.4);
        background: transparent;
        color: var(--state-error);
        font-size: 12px;
      }

      .duplicate-page {
        min-height: 100dvh;
        max-width: 380px;
        padding: 24px;
      }

      .hidden {
        display: none !important;
      }

    </style>
  </head>
  <body>
    <main class="layout" id="app">
      <header class="header">
        <div class="title">__REALTIME_VOICE_TITLE__</div>
      </header>
      <section class="controls" id="controls">
        <div class="buttons">
          <button class="primary" id="primary" type="button" aria-label="Start conversation">Start</button>
          <button class="reset hidden" id="reset" type="button">Reset</button>
          <div class="meters hidden" id="meters" aria-hidden="true">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
          </div>
        </div>
        <div class="settings">
          <div class="connection"><span class="dot connecting" id="dot"></span><span id="connectionLabel">Connecting...</span></div>
          <button class="icon-btn" id="settingsToggle" type="button" aria-label="Audio settings" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6V20a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1H4a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6V4a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.17.36.38.69.6 1H20a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-.51 1Z"></path>
            </svg>
          </button>
          <div class="settings-menu hidden" id="settingsMenu">
            <div id="micArea" class="mic-note">Microphone access is required to use voice.</div>
          </div>
        </div>
      </section>
      <section class="transcript" id="transcript" role="log" aria-live="polite" aria-label="Conversation transcript"></section>
      <audio id="remoteAudio" autoplay playsinline class="hidden"></audio>
      <footer class="input-bar">
        <div class="input-row">
          <textarea id="textInput" placeholder="Type a message..." rows="1"></textarea>
          <button class="send-btn" id="send" type="button" aria-label="Send message" disabled>↑</button>
        </div>
      </footer>
    </main>
    <script>
      const state = {
        ws: undefined,
        reconnect: 250,
        status: { server: "stopped", browserClient: "none", conversation: "none" },
        conversation: undefined,
        audio: { permission: "unknown", devices: [], ready: false },
        atBottom: true,
        streamDrafts: new Map(),
        webrtc: {
          pc: undefined,
          dc: undefined,
          dcOpen: false,
          pcConnected: false,
          connectedSent: false,
          micStream: undefined,
          micTrack: undefined,
          micSender: undefined,
          analyser: undefined,
          analyserCtx: undefined,
          metersStarted: false,
          pendingSends: [],
          sessionInFlight: false,
        },
        realtime: { responseActive: false, pendingPauseCut: false },
      };

      const $ = (id) => document.getElementById(id);
      const dot = $("dot");
      const connectionLabel = $("connectionLabel");
      const transcript = $("transcript");
      const primary = $("primary");
      const reset = $("reset");
      const textInput = $("textInput");
      const send = $("send");
      const micArea = $("micArea");
      const meters = $("meters");
      const settingsToggle = $("settingsToggle");
      const settingsMenu = $("settingsMenu");
      const remoteAudio = $("remoteAudio");

      connect();
      wireUi();
      render();

      // Detect whether the browser's autoplay policy will let unmuted media
      // start without a user gesture. If not, we hold off acquiring the mic
      // and announcing audio.ready so the server's connectOnPageLoad does
      // NOT auto-start the conversation — the user must press Start.
      // Spec: https://www.w3.org/TR/autoplay-detection/  (MDN: Navigator.getAutoplayPolicy)
      // getAutoplayPolicy can report "allowed" even when unmuted MediaStream
      // playback is still blocked, so we always do a live silent-audio probe —
      // it's the only way to actually verify that play() will succeed.
      async function canAutoplay() {
        if (navigator.userActivation && navigator.userActivation.hasBeenActive === false) {
          return false;
        }
        try {
          const probe = new Audio(
            "data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA",
          );
          probe.volume = 0;
          await probe.play();
          probe.pause();
          return true;
        } catch (error) {
          dlog("canAutoplay.probe.blocked", { message: String(error?.message ?? error) });
          return false;
        }
      }

      function connect() {
        setConnection("connecting");
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${location.host}/ws`);
        state.ws = ws;
        ws.addEventListener("open", async () => {
          state.reconnect = 250;
          setConnection("connected");
          const autoplayOk = await canAutoplay();
          dlog("autoplay.check", { allowed: autoplayOk });
          if (autoplayOk) {
            refreshAudio();
          } else {
            // Defer mic acquisition until the user clicks Start. The primary
            // button handler will call refreshAudio() at that point.
            state.audio.pendingUserGesture = true;
            renderAudioError({
              code: "AUTOPLAY_BLOCKED",
              message: "Press Start to enable audio.",
              suggestedAction: "Browsers require a click before audio can play.",
            });
          }
        });
        ws.addEventListener("message", (event) => {
          let parsed;
          try { parsed = JSON.parse(event.data); } catch (e) { dlog("ws.in.parseError", { data: String(event.data).slice(0, 200) }); return; }
          dlog("ws.in", { type: parsed.type, data: parsed.data });
          handleMessage(parsed);
        });
        ws.addEventListener("close", () => {
          setConnection("disconnected");
          setTimeout(connect, state.reconnect);
          state.reconnect = Math.min(state.reconnect * 2, 5000);
        });
        ws.addEventListener("error", () => setConnection("error"));
      }

      function wireUi() {
        primary.addEventListener("click", () => {
          // If we deferred mic acquisition pending a user gesture (autoplay
          // policy blocked), this click is the gesture — acquire the mic now
          // and let the resulting audio.ready signal trigger normal flow.
          if (state.audio.pendingUserGesture) {
            state.audio.pendingUserGesture = false;
            refreshAudio();
            return;
          }
          const status = state.status.conversation;
          if (status === "none") startConversation();
          if (status === "active") sendMessage("conversation.pause");
          if (status === "paused") sendMessage("conversation.resume");
        });
        reset.addEventListener("click", () => {
          sendMessage("conversation.reset");
          teardownWebrtc();
        });
        settingsToggle.addEventListener("click", () => {
          const isHidden = settingsMenu.classList.toggle("hidden");
          settingsToggle.setAttribute("aria-expanded", String(!isHidden));
        });
        document.addEventListener("click", (event) => {
          if (settingsMenu.classList.contains("hidden")) return;
          if (settingsMenu.contains(event.target) || settingsToggle.contains(event.target)) return;
          settingsMenu.classList.add("hidden");
          settingsToggle.setAttribute("aria-expanded", "false");
        });
        send.addEventListener("click", sendText);
        textInput.addEventListener("input", () => {
          textInput.style.height = "auto";
          textInput.style.height = `${Math.min(textInput.scrollHeight, 120)}px`;
          send.disabled = textInput.value.trim().length === 0;
        });
        textInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendText();
          }
        });
        transcript.addEventListener("scroll", () => {
          state.atBottom = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 80;
        });
      }

      function handleMessage(message) {
        if (message.type === "duplicate.client") {
          document.body.innerHTML =
            '<main class="duplicate-page"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg><h1>Session unavailable</h1><p>Another browser window is already connected to this Realtime Voice Server. Close the other session and refresh this page.</p></main>';
          return;
        }
        if (message.type === "state") {
          const previousStatus = state.status.conversation;
          state.status = {
            server: message.data.server,
            browserClient: message.data.browserClient,
            conversation: message.data.conversationStatus ?? message.data.conversation?.status ?? message.data.conversation ?? "none",
          };
          state.conversation = message.data.conversation;
          clearFinalizedDrafts();
          if ((state.status.conversation === "none" || state.status.conversation === "ended") && state.webrtc.pc) {
            teardownWebrtc();
          }
          if (state.status.conversation !== previousStatus) {
            applyPauseState(state.status.conversation, previousStatus);
          }
          render();
        }
        if (message.type === "transcript.item") {
          state.streamDrafts.delete(message.data.id ?? message.data.item?.id);
          render();
        }
        if (message.type === "transcript.delta") {
          state.streamDrafts.set(message.data.itemId, message.data);
          render();
        }
        if (message.type === "browser.audio.error") {
          renderAudioError(message.data);
        }
        if (message.type === "browser.audio.deviceChange") {
          state.audio.devices = message.data.devices ?? [];
          state.audio.selectedDeviceId = message.data.selectedDeviceId;
          renderMicSelector();
        }
        if (message.type === "webrtc.session.start") {
          dlog("webrtc.session.start.received", { conversationStatus: state.status.conversation, audioReady: state.audio.ready });
          if (!state.webrtc.sessionInFlight) {
            state.webrtc.sessionInFlight = true;
            sendMessage("webrtc.session.requested");
          }
        }
        if (message.type === "webrtc.session.token") {
          dlog("webrtc.session.token.received", { hasClientSecret: !!message.data?.clientSecret, model: message.data?.model, expiresAt: message.data?.expiresAt });
          establishWebrtc(message.data).catch((error) => {
            dlog("establishWebrtc.unhandled", { message: error?.message, stack: error?.stack });
            failWebrtc("WEBRTC_SETUP_FAILED", error?.message ?? String(error));
          });
        }
        if (message.type === "realtime.send") {
          forwardRealtimeSend(message.data?.event);
        }
        if (message.type === "wait_for_context.start") {
          startMetronome();
        }
        if (message.type === "wait_for_context.end") {
          stopMetronome();
        }
      }

      // ──────────────────────────────────────────────────────────────────────
      // Wait-for-context metronome: a gentle click every 2s while the agent
      // is paused waiting for new <context>/<topics> from the orchestrator.
      // ──────────────────────────────────────────────────────────────────────
      const metronome = { ctx: undefined, timer: undefined };

      function startMetronome() {
        if (metronome.timer) return;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!metronome.ctx) metronome.ctx = new Ctx();
        if (metronome.ctx.state === "suspended") {
          metronome.ctx.resume().catch((error) => {
            dlog("metronome.resume.failed", { message: String(error?.message ?? error) });
          });
        }
        const click = () => {
          const ctx = metronome.ctx;
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = 880;
          const now = ctx.currentTime;
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.05, now + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
          osc.connect(gain).connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        };
        click();
        metronome.timer = setInterval(click, 2000);
      }

      function stopMetronome() {
        if (metronome.timer) {
          clearInterval(metronome.timer);
          metronome.timer = undefined;
        }
      }

      async function refreshAudio() {
        if (!navigator.mediaDevices?.getUserMedia) return;
        try {
          const probe = await navigator.mediaDevices.getUserMedia({ audio: true });
          probe.getTracks().forEach((track) => track.stop());
          const devices = (await navigator.mediaDevices.enumerateDevices())
            .filter((device) => device.kind === "audioinput")
            .map((device) => ({ deviceId: device.deviceId, label: device.label || "Microphone", groupId: device.groupId }));
          const previous = state.audio.selectedDeviceId;
          const selected = devices.find((device) => device.deviceId === previous)?.deviceId ?? devices[0]?.deviceId;
          state.audio = { permission: "granted", devices, selectedDeviceId: selected, ready: true };
          sendMessage("audio.device.state", state.audio);
          renderMicSelector();
        } catch (error) {
          const details = {
            code: "MICROPHONE_DEVICE_ERROR",
            message: "Could not access the selected microphone.",
            suggestedAction: "Allow microphone access and try again.",
          };
          sendMessage("browser.audio.error", details);
          renderAudioError(details);
        }
      }

      async function acquireMicStream(deviceId) {
        const audio = {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        };
        if (deviceId) audio.deviceId = { exact: deviceId };
        return navigator.mediaDevices.getUserMedia({ audio });
      }

      function startMeters(stream) {
        if (state.webrtc.analyserCtx) {
          try {
            state.webrtc.analyserCtx.close();
          } catch (error) {
            dlog("startMeters.analyserCtx.close.failed", { message: String(error?.message ?? error) });
          }
        }
        const audioCtx = new AudioContext();
        if (audioCtx.state === "suspended") {
          audioCtx.resume().catch((error) => {
            dlog("startMeters.audioCtx.resume.failed", { message: String(error?.message ?? error) });
          });
        }
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        audioCtx.createMediaStreamSource(stream).connect(analyser);
        state.webrtc.analyser = analyser;
        state.webrtc.analyserCtx = audioCtx;
        if (state.webrtc.metersStarted) return;
        state.webrtc.metersStarted = true;
        const data = new Uint8Array(analyser.frequencyBinCount);
        const bars = [...meters.querySelectorAll(".bar")];
        function updateBars() {
          const current = state.webrtc.analyser;
          if (current) {
            current.getByteFrequencyData(data);
            bars.forEach((bar, index) => {
              bar.style.setProperty("--level", Math.max(0.1, data[index * 10] / 255));
            });
          }
          requestAnimationFrame(updateBars);
        }
        updateBars();
      }

      function startConversation() {
        if (state.webrtc.sessionInFlight || state.webrtc.pc) return;
        if (!state.audio.ready) {
          renderAudioError({
            code: "MICROPHONE_NOT_READY",
            message: "Microphone is not ready.",
            suggestedAction: "Grant microphone access and try again.",
          });
          return;
        }
        state.webrtc.sessionInFlight = true;
        sendMessage("conversation.start");
        sendMessage("webrtc.session.requested");
      }

      async function establishWebrtc(token) {
        dlog("establishWebrtc.enter", { hasToken: !!token, hasClientSecret: !!token?.clientSecret, model: token?.model });
        if (!token?.clientSecret || !token?.model) {
          failWebrtc("WEBRTC_TOKEN_INVALID", "Missing client secret or model.");
          return;
        }
        if (state.webrtc.pc) {
          dlog("establishWebrtc.skip", { reason: "pc already exists" });
          return;
        }
        try {
          dlog("acquireMicStream.start", { deviceId: state.audio.selectedDeviceId });
          const stream = await acquireMicStream(state.audio.selectedDeviceId);
          state.webrtc.micStream = stream;
          const track = stream.getAudioTracks()[0];
          state.webrtc.micTrack = track;
          dlog("acquireMicStream.ok", { trackId: track?.id, label: track?.label, enabled: track?.enabled, muted: track?.muted });
          startMeters(stream);

          const pc = new RTCPeerConnection();
          dlog("RTCPeerConnection.created", webrtcSnapshot());
          state.webrtc.pc = pc;
          state.webrtc.micSender = pc.addTrack(track, stream);
          pc.ontrack = (event) => {
            dlog("pc.ontrack", { kind: event.track?.kind, streams: event.streams?.length });
            const [remoteStream] = event.streams;
            if (remoteStream) remoteAudio.srcObject = remoteStream;
          };
          pc.onconnectionstatechange = () => {
            dlog("pc.connectionstatechange", { connectionState: pc.connectionState });
            const connectionState = pc.connectionState;
            if (connectionState === "connected") {
              state.webrtc.pcConnected = true;
              maybeAnnounceConnected();
            }
            if (connectionState === "failed" || connectionState === "closed") {
              if (!state.webrtc.connectedSent) {
                failWebrtc("WEBRTC_PC_FAILED", `Peer connection ${connectionState}.`);
              }
            }
          };
          pc.oniceconnectionstatechange = () => dlog("pc.iceconnectionstatechange", { iceConnectionState: pc.iceConnectionState });
          pc.onicegatheringstatechange = () => dlog("pc.icegatheringstatechange", { iceGatheringState: pc.iceGatheringState });
          pc.onsignalingstatechange = () => dlog("pc.signalingstatechange", { signalingState: pc.signalingState });
          pc.onicecandidateerror = (event) => dlog("pc.icecandidateerror", { errorCode: event.errorCode, errorText: event.errorText, url: event.url });

          const dc = pc.createDataChannel("oai-events");
          state.webrtc.dc = dc;
          dc.onopen = () => {
            dlog("dc.onopen", { readyState: dc.readyState });
            state.webrtc.dcOpen = true;
            for (const payload of state.webrtc.pendingSends) {
              try {
                dc.send(payload);
              } catch (error) {
                dlog("dc.send.pending.failed", { message: String(error?.message ?? error) });
              }
            }
            state.webrtc.pendingSends = [];
            maybeAnnounceConnected();
          };
          dc.onclose = () => { dlog("dc.onclose", {}); state.webrtc.dcOpen = false; };
          dc.onerror = (e) => dlog("dc.onerror", { message: String(e?.error?.message ?? e?.message ?? e) });
          dc.onmessage = (event) => {
            const parsed = JSON.parse(event.data);
            if (parsed?.type === "response.created") {
              state.realtime.responseActive = true;
            } else if (parsed?.type === "response.done" || parsed?.type === "response.cancelled" || parsed?.type === "response.failed") {
              state.realtime.responseActive = false;
            }
            // The actual end-of-audio signal is output_audio_buffer.stopped —
            // that's when all queued audio chunks have been delivered. Using
            // response.done would cut off the avatar mid-sentence because
            // generation completes before audio finishes streaming.
            if (parsed?.type === "output_audio_buffer.stopped" && state.realtime.pendingPauseCut) {
              state.realtime.pendingPauseCut = false;
              applyPauseAudioCut();
            }
            sendMessage("realtime.event", { event: parsed });
          };

          const offer = await pc.createOffer();
          dlog("pc.createOffer.ok", { sdpLength: offer.sdp?.length });
          await pc.setLocalDescription(offer);
          dlog("pc.setLocalDescription.ok", { signalingState: pc.signalingState });

          const sdpUrl = `https://api.openai.com/v1/realtime/calls?model=${encodeURIComponent(token.model)}`;
          dlog("sdp.fetch.start", { url: sdpUrl, sdpLength: pc.localDescription.sdp?.length });
          const fetchStart = Date.now();
          const response = await fetch(sdpUrl, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token.clientSecret}`,
              "Content-Type": "application/sdp",
            },
            body: pc.localDescription.sdp,
          });
          dlog("sdp.fetch.response", { status: response.status, ok: response.ok, durationMs: Date.now() - fetchStart, headers: Object.fromEntries(response.headers.entries()) });
          if (!response.ok) {
            const body = await response.text().catch(() => "");
            dlog("sdp.fetch.errorBody", { status: response.status, body: body.slice(0, 500) });
            throw new Error(`OpenAI SDP exchange failed (${response.status}): ${body.slice(0, 200)}`);
          }
          const answerSdp = await response.text();
          dlog("sdp.fetch.ok", { answerSdpLength: answerSdp.length });
          await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
          dlog("pc.setRemoteDescription.ok", webrtcSnapshot());
        } catch (error) {
          dlog("establishWebrtc.catch", { message: error?.message, name: error?.name, stack: error?.stack, snapshot: webrtcSnapshot() });
          failWebrtc("WEBRTC_SETUP_FAILED", error?.message ?? String(error));
        }
      }

      function maybeAnnounceConnected() {
        const { pcConnected, dcOpen, connectedSent } = state.webrtc;
        dlog("maybeAnnounceConnected", { pcConnected, dcOpen, connectedSent });
        if (!pcConnected || !dcOpen || connectedSent) return;
        state.webrtc.connectedSent = true;
        state.webrtc.sessionInFlight = false;
        sendMessage("webrtc.session.connected");
      }

      function forwardRealtimeSend(event) {
        if (!event) return;
        const payload = JSON.stringify(event);
        const { dc, dcOpen } = state.webrtc;
        if (dc && dcOpen) {
          try {
            dc.send(payload);
          } catch (error) {
            dlog("dc.send.failed.requeue", { message: String(error?.message ?? error) });
            state.webrtc.pendingSends.push(payload);
          }
          return;
        }
        state.webrtc.pendingSends.push(payload);
      }

      function failWebrtc(code, message) {
        dlog("failWebrtc", { code, message, snapshot: webrtcSnapshot() });
        sendMessage("webrtc.session.failed", { error: { code, message } });
        teardownWebrtc();
      }

      function teardownWebrtc() {
        const { pc, micStream, analyserCtx } = state.webrtc;
        if (pc) {
          try {
            pc.close();
          } catch (error) {
            dlog("teardown.pc.close.failed", { message: String(error?.message ?? error) });
          }
        }
        if (micStream) {
          micStream.getTracks().forEach((track) => track.stop());
        }
        if (analyserCtx) {
          try {
            analyserCtx.close();
          } catch (error) {
            dlog("teardown.analyserCtx.close.failed", { message: String(error?.message ?? error) });
          }
        }
        remoteAudio.srcObject = null;
        state.webrtc.pc = undefined;
        state.webrtc.dc = undefined;
        state.webrtc.dcOpen = false;
        state.webrtc.pcConnected = false;
        state.webrtc.connectedSent = false;
        state.webrtc.micStream = undefined;
        state.webrtc.micTrack = undefined;
        state.webrtc.micSender = undefined;
        state.webrtc.analyser = undefined;
        state.webrtc.analyserCtx = undefined;
        state.webrtc.pendingSends = [];
        state.webrtc.sessionInFlight = false;
      }

      function applyPauseState(status, previousStatus) {
        const paused = status === "paused";
        const wasPaused = previousStatus === "paused";
        const { micTrack, micSender } = state.webrtc;
        if (paused) {
          // If a response is currently being spoken, defer the audio cut
          // until response.done fires so the avatar can finish its sentence.
          if (state.realtime.responseActive) {
            state.realtime.pendingPauseCut = true;
            // Stop the user's mic from sending audio immediately so the
            // model can't pick up more input during the wind-down.
            if (micTrack) micTrack.enabled = false;
            micSender?.replaceTrack(null).catch((error) => {
              dlog("micSender.replaceTrack(null).failed", { message: String(error?.message ?? error) });
            });
            return;
          }
          applyPauseAudioCut();
        } else if (status === "active") {
          // Resuming: clear any deferred pause-cut, re-enable the local
          // mic track, restore the sender, and unmute remote playback.
          state.realtime.pendingPauseCut = false;
          if (micTrack) micTrack.enabled = true;
          remoteAudio.muted = false;
          remoteAudio.play().catch((error) => {
            dlog("remoteAudio.play.blocked", { message: String(error?.message ?? error) });
          });
          if (wasPaused && micSender && micTrack) {
            micSender.replaceTrack(micTrack).catch((error) => {
              dlog("micSender.replaceTrack(micTrack).failed", { message: String(error?.message ?? error) });
            });
          }
        }
      }

      // Applies the actual audio-pause side effects: mute remote audio, stop
      // sending mic RTP, cancel any in-flight response. Called either
      // immediately on pause (no active response) or deferred from
      // applyPauseState until response.done fires.
      function applyPauseAudioCut() {
        const { micTrack, micSender, dc, dcOpen } = state.webrtc;
        if (micTrack) micTrack.enabled = false;
        remoteAudio.muted = true;
        remoteAudio.pause();
        micSender?.replaceTrack(null).catch((error) => {
          dlog("micSender.replaceTrack(null).failed", { message: String(error?.message ?? error) });
        });
        if (dc && dcOpen && state.realtime.responseActive) {
          dc.send(JSON.stringify({ type: "response.cancel" }));
        }
      }

      async function switchMicDevice(deviceId) {
        state.audio.selectedDeviceId = deviceId;
        sendMessage("audio.device.select", { deviceId });
        if (!state.webrtc.pc) return;
        try {
          const stream = await acquireMicStream(deviceId);
          const track = stream.getAudioTracks()[0];
          if (state.webrtc.micSender) await state.webrtc.micSender.replaceTrack(track);
          if (state.webrtc.micStream) {
            state.webrtc.micStream.getTracks().forEach((existing) => existing.stop());
          }
          state.webrtc.micStream = stream;
          state.webrtc.micTrack = track;
          startMeters(stream);
        } catch (error) {
          renderAudioError({
            code: "MICROPHONE_SWITCH_FAILED",
            message: error?.message ?? "Could not switch microphone.",
            suggestedAction: "Try a different device.",
          });
        }
      }

      function bytesToBase64(bytes) {
        let binary = "";
        for (let i = 0; i < bytes.length; i += 1) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      }

      function base64ToBytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function render() {
        const status = state.status.conversation;
        primary.className = "primary";
        primary.disabled = !["none", "active", "paused"].includes(status);
        primary.textContent =
          status === "active" ? "Pause" :
          status === "paused" ? "Resume" :
          status === "starting" ? "Starting…" :
          "Start";
        primary.setAttribute("aria-label", `${primary.textContent} conversation`);
        if (status === "active") primary.classList.add("pause");
        if (status === "paused") primary.classList.add("resume");
        reset.classList.toggle("hidden", !["active", "paused"].includes(status));
        meters.classList.toggle("hidden", status !== "active" || !state.audio.ready);
        renderTranscript();
      }

      function renderTranscript() {
        transcript.innerHTML = "";
        const conversation = state.conversation;
        if (!conversation) {
          transcript.innerHTML =
            '<div class="empty-state"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2v20M5 8v8M19 8v8"/></svg><div>Ready to start</div></div>';
          return;
        }
        if (conversation.status === "ended") {
          transcript.innerHTML = '<div class="ended-state"><strong>Conversation ended</strong><span>Transcript is no longer active.</span></div>';
          return;
        }
        const byTranscript = new Map((conversation.transcript ?? []).map((item) => [item.id, item]));
        const byTool = new Map((conversation.toolCalls ?? []).map((item) => [item.id, item]));
        for (const entry of conversation.timeline ?? []) {
          if (entry.type === "transcript") renderTranscriptItem(byTranscript.get(entry.transcriptItemId));
          if (entry.type === "toolCall") renderToolCall(byTool.get(entry.toolCallId));
        }
        for (const draft of state.streamDrafts.values()) {
          if (byTranscript.has(draft.itemId)) continue;
          renderTranscriptItem({
            id: draft.itemId,
            role: draft.role ?? "assistant",
            source: draft.source ?? "assistantAudio",
            text: draft.fullTextSoFar,
            streaming: true,
          });
        }
        maybeScrollToBottom();
      }

      function renderTranscriptItem(item) {
        if (!item) return;
        const node = document.createElement("article");
        node.className = `transcript-item role-${item.role} source-${item.source}`;
        if (item.streaming) node.classList.add("streaming");
        node.textContent = item.text;
        transcript.append(node);
      }

      function clearFinalizedDrafts() {
        const finalized = new Set((state.conversation?.transcript ?? []).map((item) => item.id));
        for (const itemId of state.streamDrafts.keys()) {
          if (finalized.has(itemId)) state.streamDrafts.delete(itemId);
        }
      }

      function renderToolCall(tool) {
        if (!tool) return;
        const node = document.createElement("article");
        node.className = "tool-call";
        node.tabIndex = 0;
        node.innerHTML = `<div class="tool-row"><span class="toggle">▸</span><span>Tool: ${escapeText(tool.toolName)}(...)</span><span class="badge ${tool.status}">${tool.status}</span></div><div class="tool-call-body"><div class="section-label">ARGUMENTS</div><pre>${escapeText(JSON.stringify(tool.arguments, null, 2))}</pre><div class="section-label">RESULT</div><pre>${escapeText(JSON.stringify(tool.result ?? tool.error ?? null, null, 2))}</pre></div>`;
        const toggle = () => {
          node.classList.toggle("expanded");
          const body = node.querySelector(".tool-call-body");
          node.style.setProperty("--body-height", `${body.scrollHeight}px`);
          node.querySelector(".toggle").textContent = node.classList.contains("expanded") ? "▾" : "▸";
        };
        node.addEventListener("click", toggle);
        node.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") toggle();
        });
        transcript.append(node);
      }

      function renderMicSelector() {
        if (!state.audio.ready) return;
        micArea.innerHTML = '<label class="field-label" for="micSelect">Microphone</label><select id="micSelect"></select>';
        const select = micArea.querySelector("#micSelect");
        if (!select) return;
        for (const device of state.audio.devices) {
          const option = document.createElement("option");
          option.value = device.deviceId;
          option.textContent = device.label;
          option.selected = device.deviceId === state.audio.selectedDeviceId;
          select.append(option);
        }
        select.addEventListener("change", () => switchMicDevice(select.value));
      }

      function renderAudioError(error) {
        micArea.innerHTML = `<div class="error-block"><div class="error-title">Microphone error</div><div>${escapeText(error.message)}</div><div><strong>Reason:</strong> ${escapeText(error.code)}</div><div><strong>Suggested action:</strong> ${escapeText(error.suggestedAction)}</div><button class="retry" type="button">Retry</button></div>`;
        micArea.querySelector("button").addEventListener("click", refreshAudio);
      }

      function sendText() {
        const text = textInput.value.trim();
        if (!text) return;
        sendMessage("message.text", { text });
        textInput.value = "";
        textInput.dispatchEvent(new Event("input"));
      }

      function sendMessage(type, data) {
        if (type !== "browser.debug") dlog("ws.out", { type, data });
        if (state.ws?.readyState === WebSocket.OPEN) state.ws.send(JSON.stringify({ type, data }));
      }

      function dlog(label, info) {
        // dlog is called from every code path; if logging itself throws
        // (e.g. WS in odd state, JSON.stringify on a circular ref), we must
        // not propagate — that would surface as a fatal in unrelated callers.
        try {
          const payload = { label, info, t: Date.now() };
          console.log("[dbg]", label, info);
          if (state.ws?.readyState === WebSocket.OPEN) {
            state.ws.send(JSON.stringify({ type: "browser.debug", data: payload }));
          }
        } catch (error) {
          console.error("dlog itself threw", error);
        }
      }

      function webrtcSnapshot() {
        const { pc, dc } = state.webrtc;
        return {
          sessionInFlight: state.webrtc.sessionInFlight,
          pcConnected: state.webrtc.pcConnected,
          dcOpen: state.webrtc.dcOpen,
          connectedSent: state.webrtc.connectedSent,
          hasMicTrack: !!state.webrtc.micTrack,
          pc: pc ? {
            connectionState: pc.connectionState,
            iceConnectionState: pc.iceConnectionState,
            iceGatheringState: pc.iceGatheringState,
            signalingState: pc.signalingState,
          } : null,
          dc: dc ? { readyState: dc.readyState, label: dc.label } : null,
        };
      }

      window.addEventListener("error", (e) => dlog("window.error", { message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno }));
      window.addEventListener("unhandledrejection", (e) => dlog("window.unhandledrejection", { reason: String(e.reason), stack: e.reason?.stack }));

      function setConnection(status) {
        dot.className = `dot ${status}`;
        connectionLabel.textContent =
          status === "connected" ? "Connected" : status === "connecting" ? "Connecting..." : status === "error" ? "Connection Error" : "Disconnected";
      }

      function maybeScrollToBottom() {
        if (state.atBottom) transcript.scrollTop = transcript.scrollHeight;
      }

      function escapeText(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      }
    </script>
  </body>
</html>
