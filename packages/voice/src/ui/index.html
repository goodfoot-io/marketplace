<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__REALTIME_VOICE_TITLE__</title>
    <style>
      :root {
        --bg-base: #09090b;
        --bg-card: #18181b;
        --border: #27272a;
        --text-dim: #52525b;
        --text-muted: #71717a;
        --text-default: #a1a1aa;
        --text-bright: #e4e4e7;
        --text-white: #fafafa;
        --accent: #22d3ee;
        --role-user: #a78bfa;
        --role-assistant: #34d399;
        --role-system: #fb923c;
        --role-tool: #60a5fa;
        --state-error: #f87171;
        --dot-connected: #22c55e;
        --dot-connecting: #eab308;
        --dot-disconnected: #52525b;
        --dot-error: #f87171;
        --font-sans: "Geist", "Inter", system-ui, -apple-system, sans-serif;
        --font-mono: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        min-height: 100dvh;
        margin: 0;
        background: var(--bg-base);
        color: var(--text-default);
        font-family: var(--font-sans);
      }

      button,
      textarea,
      select {
        font: inherit;
      }

      button:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      .tool-call:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .layout {
        width: 100%;
        max-width: 680px;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .header {
        display: none;
        height: 0;
        padding: 0;
        border-bottom: 1px solid var(--border);
        background: var(--bg-base);
        position: sticky;
        top: 0;
        z-index: 10;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .title {
        color: var(--text-bright);
        font-size: 14px;
        font-weight: 500;
      }

      .connection {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-muted);
        font-family: var(--font-mono);
        font-size: 11px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dot-disconnected);
      }

      .dot.connected {
        background: var(--dot-connected);
      }

      .dot.connecting {
        background: var(--dot-connecting);
      }

      .dot.error {
        background: var(--dot-error);
      }

      .controls {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-shrink: 0;
      }

      .field-label {
        color: var(--text-muted);
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .mic-note,
      .input-hint {
        color: var(--text-muted);
        font-size: 12px;
        font-style: italic;
      }

      select {
        width: 100%;
        appearance: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-bright);
        padding: 6px 10px;
        font-size: 13px;
      }

      .buttons,
      .input-row,
      .meters {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .buttons {
        min-width: 0;
      }

      .settings {
        position: relative;
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .icon-btn {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
      }

      .icon-btn:hover {
        color: var(--text-bright);
        border-color: #3f3f46;
      }

      .settings-menu {
        position: absolute;
        right: 0;
        top: 40px;
        z-index: 20;
        width: min(320px, calc(100vw - 32px));
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-card);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }

      .primary,
      .reset,
      .retry {
        height: 32px;
        padding: 0 14px;
        border-radius: 6px;
        cursor: pointer;
        transition:
          opacity 150ms,
          transform 80ms,
          color 150ms,
          border-color 150ms,
          background 150ms;
      }

      .primary {
        border: none;
        background: var(--accent);
        color: #000;
        font-size: 13px;
        font-weight: 500;
      }

      .primary.pause {
        background: var(--bg-card);
        color: var(--text-bright);
        border: 1px solid var(--border);
      }

      .primary.resume {
        background: rgba(34, 211, 238, 0.1);
        border: 1px solid rgba(34, 211, 238, 0.3);
        color: var(--accent);
      }

      .primary:disabled,
      .send-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .reset {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        font-size: 13px;
      }

      .reset:hover {
        border-color: #3f3f46;
        color: var(--state-error);
      }

      .menu-item {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--text-bright);
        font-size: 13px;
        text-align: left;
        cursor: pointer;
        transition: border-color 150ms, color 150ms, background 150ms;
      }

      .menu-item:hover:enabled {
        border-color: #3f3f46;
        background: rgba(255, 255, 255, 0.04);
      }

      .menu-item:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      button:active:enabled {
        transform: scale(0.97);
      }

      .meters {
        height: 16px;
        align-items: flex-end;
      }

      .bar {
        width: 2px;
        height: 16px;
        border-radius: 2px;
        background: rgba(34, 211, 238, 0.6);
        transform: scaleY(var(--level, 0.1));
        transform-origin: bottom;
        transition: transform 50ms linear;
      }

      .transcript {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .empty-state,
      .ended-state,
      .duplicate-page {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        color: var(--text-muted);
      }

      .empty-icon {
        width: 32px;
        height: 32px;
        opacity: 0.5;
      }

      .transcript-item {
        padding: 8px 12px;
        border-radius: 0 6px 6px 0;
        color: var(--text-bright);
        font-size: 14px;
        line-height: 1.55;
        word-break: break-word;
      }

      .transcript-item.streaming {
        opacity: 1;
      }

      .role-user {
        border-left: 2px solid var(--role-user);
      }

      .role-assistant {
        border-left: 2px solid var(--role-assistant);
      }

      .role-system {
        border-left: 2px solid var(--role-system);
        background: rgba(251, 146, 60, 0.06);
        color: rgba(251, 146, 60, 0.85);
        font-size: 13px;
        font-style: italic;
      }

      .source-textInput {
        background: rgba(167, 139, 250, 0.04);
      }

      .source-system.role-user,
      .source-system.role-assistant {
        border-left-style: dashed;
        color: var(--text-default);
      }

      .source-firstMessage {
        position: relative;
        border: 1px solid rgba(167, 139, 250, 0.25);
        background: rgba(167, 139, 250, 0.06);
        border-radius: 6px;
        padding-right: 110px;
      }

      .source-firstMessage::after {
        content: "first message";
        position: absolute;
        top: 6px;
        right: 8px;
        color: var(--text-dim);
        font-family: var(--font-mono);
        font-size: 10px;
      }

      .tool-call {
        background: rgba(96, 165, 250, 0.07);
        border: 1px solid rgba(96, 165, 250, 0.18);
        border-radius: 6px;
        padding: 7px 10px;
        font-family: var(--font-mono);
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }

      .tool-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .badge {
        border-radius: 4px;
        padding: 2px 7px;
        background: rgba(52, 211, 153, 0.12);
        color: #34d399;
        font-size: 11px;
      }

      .badge.started {
        background: rgba(251, 191, 36, 0.15);
        color: #fbbf24;
      }

      .badge.failed {
        background: rgba(248, 113, 113, 0.12);
        color: #f87171;
      }

      .badge.interrupted {
        background: rgba(161, 161, 170, 0.12);
        color: #71717a;
      }

      .tool-call-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 220ms ease-out;
      }

      .tool-call.expanded .tool-call-body {
        max-height: var(--body-height);
      }

      .section-label {
        margin: 10px 0 4px;
        color: var(--text-dim);
        font-size: 11px;
        letter-spacing: 0.08em;
      }

      pre {
        margin: 0 0 8px;
        padding: 8px;
        overflow-x: auto;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.25);
        color: var(--text-default);
        white-space: pre-wrap;
        word-break: break-all;
      }

      .input-bar {
        flex-shrink: 0;
        border-top: 1px solid var(--border);
        background: var(--bg-base);
        padding: 10px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      textarea {
        flex: 1;
        min-height: 36px;
        max-height: 120px;
        resize: none;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-card);
        color: var(--text-bright);
        padding: 8px 12px;
        font-size: 14px;
        line-height: 1.5;
      }

      textarea:focus {
        border-color: rgba(34, 211, 238, 0.4);
      }

      textarea::placeholder {
        color: var(--text-dim);
      }

      .send-btn {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #000;
        cursor: pointer;
      }

      .send-btn:disabled {
        background: var(--bg-card);
        color: var(--text-dim);
      }

      .error-block {
        background: rgba(248, 113, 113, 0.07);
        border: 1px solid rgba(248, 113, 113, 0.2);
        border-radius: 6px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .error-title {
        color: var(--state-error);
        font-size: 13px;
        font-weight: 600;
      }

      .retry {
        height: 28px;
        border: 1px solid rgba(248, 113, 113, 0.4);
        background: transparent;
        color: var(--state-error);
        font-size: 12px;
      }

      .duplicate-page {
        min-height: 100dvh;
        max-width: 380px;
        padding: 24px;
      }

      .hidden {
        display: none !important;
      }

      .thinking {
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 6px 10px;
        margin: 0 16px 8px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted);
      }

      .thinking[hidden] {
        display: none;
      }

      .thinking .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.4;
        animation: thinking-pulse 1s ease-in-out infinite;
      }

      .thinking .dot:nth-child(2) { animation-delay: 0.15s; }
      .thinking .dot:nth-child(3) { animation-delay: 0.3s; }

      @keyframes thinking-pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.1); }
      }

    </style>
  </head>
  <body>
    <main class="layout" id="app">
      <header class="header">
        <div class="title">__REALTIME_VOICE_TITLE__</div>
      </header>
      <section class="controls" id="controls">
        <div class="buttons">
          <button class="primary" id="primary" type="button" aria-label="Start conversation">Start</button>
          <button class="reset hidden" id="reset" type="button">Reset</button>
          <div class="meters hidden" id="meters" aria-hidden="true">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
          </div>
        </div>
        <div class="settings">
          <div class="connection"><span class="dot connecting" id="dot"></span><span id="connectionLabel">Connecting...</span></div>
          <button class="icon-btn" id="settingsToggle" type="button" aria-label="Audio settings" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6V20a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1H4a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6V4a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.17.36.38.69.6 1H20a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-.51 1Z"></path>
            </svg>
          </button>
          <div class="settings-menu hidden" id="settingsMenu">
            <div id="micArea" class="mic-note">Microphone access is required to use voice.</div>
            <button class="menu-item" id="download" type="button" disabled>Download transcript (JSONL)</button>
          </div>
        </div>
      </section>
      <section class="transcript" id="transcript" role="log" aria-live="polite" aria-label="Conversation transcript"></section>
      <div id="thinking" class="thinking" hidden aria-live="polite">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <audio id="remoteAudio" autoplay playsinline class="hidden"></audio>
      <footer class="input-bar">
        <div class="input-row">
          <textarea id="textInput" placeholder="Type a message..." rows="1"></textarea>
          <button class="send-btn" id="send" type="button" aria-label="Send message" disabled>↑</button>
        </div>
      </footer>
    </main>
    <script>
      const state = {
        ws: undefined,
        reconnect: 250,
        status: { server: "stopped", browserClient: "none", conversation: "none" },
        conversation: undefined,
        audio: { permission: "unknown", devices: [], ready: false },
        atBottom: true,
        streamDrafts: new Map(),
        voice: {
          xaiWs: undefined,
          xaiOpen: false,
          connectedSent: false,
          micStream: undefined,
          micTrack: undefined,
          micSourceNode: undefined,
          workletNode: undefined,
          inputCtx: undefined,
          outputCtx: undefined,
          nextPlaybackTime: 0,
          playbackEndsAt: 0,
          analyser: undefined,
          analyserCtx: undefined,
          metersStarted: false,
          pendingSends: [],
          preOpenAudio: [],
          deferredSends: [],
          sessionInFlight: false,
          tokenExpiresAt: 0,
          paused: false,
        },
        realtime: { responseActive: false, pendingPauseCut: false },
      };

      const $ = (id) => document.getElementById(id);
      const dot = $("dot");
      const connectionLabel = $("connectionLabel");
      const transcript = $("transcript");
      const primary = $("primary");
      const reset = $("reset");
      const download = $("download");
      const textInput = $("textInput");
      const send = $("send");
      const micArea = $("micArea");
      const meters = $("meters");
      const settingsToggle = $("settingsToggle");
      const settingsMenu = $("settingsMenu");
      const remoteAudio = $("remoteAudio");

      connect();
      wireUi();
      render();

      // Detect whether the browser's autoplay policy will let unmuted media
      // start without a user gesture. If not, we hold off acquiring the mic
      // and announcing audio.ready so the server's connectOnPageLoad does
      // NOT auto-start the conversation — the user must press Start.
      // Spec: https://www.w3.org/TR/autoplay-detection/  (MDN: Navigator.getAutoplayPolicy)
      // getAutoplayPolicy can report "allowed" even when unmuted MediaStream
      // playback is still blocked, so we always do a live silent-audio probe —
      // it's the only way to actually verify that play() will succeed.
      async function canAutoplay() {
        if (navigator.userActivation && navigator.userActivation.hasBeenActive === false) {
          return false;
        }
        try {
          const probe = new Audio(
            "data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA",
          );
          probe.volume = 0;
          await probe.play();
          probe.pause();
          return true;
        } catch (error) {
          dlog("canAutoplay.probe.blocked", { message: String(error?.message ?? error) });
          return false;
        }
      }

      function connect() {
        setConnection("connecting");
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${location.host}/ws`);
        state.ws = ws;
        ws.addEventListener("open", async () => {
          state.reconnect = 250;
          setConnection("connected");
          const autoplayOk = await canAutoplay();
          dlog("autoplay.check", { allowed: autoplayOk });
          if (autoplayOk) {
            refreshAudio();
          } else {
            // Defer mic acquisition until the user clicks Start. The primary
            // button handler will call refreshAudio() at that point.
            state.audio.pendingUserGesture = true;
            renderAudioError({
              code: "AUTOPLAY_BLOCKED",
              message: "Press Start to enable audio.",
              suggestedAction: "Browsers require a click before audio can play.",
            });
          }
        });
        ws.addEventListener("message", (event) => {
          let parsed;
          try { parsed = JSON.parse(event.data); } catch (e) { dlog("ws.in.parseError", { data: String(event.data).slice(0, 200) }); return; }
          dlog("ws.in", { type: parsed.type, data: parsed.data });
          handleMessage(parsed);
        });
        ws.addEventListener("close", () => {
          setConnection("disconnected");
          setTimeout(connect, state.reconnect);
          state.reconnect = Math.min(state.reconnect * 2, 5000);
        });
        ws.addEventListener("error", () => setConnection("error"));
      }

      function wireUi() {
        primary.addEventListener("click", () => {
          // If we deferred mic acquisition pending a user gesture (autoplay
          // policy blocked), this click is the gesture — acquire the mic now
          // and let the resulting audio.ready signal trigger normal flow.
          if (state.audio.pendingUserGesture) {
            state.audio.pendingUserGesture = false;
            refreshAudio();
            return;
          }
          const status = state.status.conversation;
          if (status === "none") startConversation();
          if (status === "active") sendMessage("conversation.pause");
          if (status === "paused") sendMessage("conversation.resume");
        });
        reset.addEventListener("click", () => {
          sendMessage("conversation.reset");
          teardownVoice();
        });
        download.addEventListener("click", downloadTranscript);
        settingsToggle.addEventListener("click", () => {
          const isHidden = settingsMenu.classList.toggle("hidden");
          settingsToggle.setAttribute("aria-expanded", String(!isHidden));
        });
        document.addEventListener("click", (event) => {
          if (settingsMenu.classList.contains("hidden")) return;
          if (settingsMenu.contains(event.target) || settingsToggle.contains(event.target)) return;
          settingsMenu.classList.add("hidden");
          settingsToggle.setAttribute("aria-expanded", "false");
        });
        send.addEventListener("click", sendText);
        textInput.addEventListener("input", () => {
          textInput.style.height = "auto";
          textInput.style.height = `${Math.min(textInput.scrollHeight, 120)}px`;
          send.disabled = textInput.value.trim().length === 0;
        });
        textInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendText();
          }
        });
        transcript.addEventListener("scroll", () => {
          state.atBottom = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 80;
        });
      }

      function handleMessage(message) {
        if (message.type === "duplicate.client") {
          document.body.innerHTML =
            '<main class="duplicate-page"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg><h1>Session unavailable</h1><p>Another browser window is already connected to this Voice Agent. Close the other session and refresh this page.</p></main>';
          return;
        }
        if (message.type === "state") {
          const previousStatus = state.status.conversation;
          state.status = {
            server: message.data.server,
            browserClient: message.data.browserClient,
            conversation: message.data.conversationStatus ?? message.data.conversation?.status ?? message.data.conversation ?? "none",
          };
          state.conversation = message.data.conversation;
          clearFinalizedDrafts();
          if ((state.status.conversation === "none" || state.status.conversation === "ended") && state.voice.xaiWs) {
            teardownVoice();
          }
          if (state.status.conversation !== previousStatus) {
            applyPauseState(state.status.conversation, previousStatus);
          }
          render();
        }
        if (message.type === "transcript.item") {
          state.streamDrafts.delete(message.data.id ?? message.data.item?.id);
          render();
        }
        if (message.type === "transcript.delta") {
          state.streamDrafts.set(message.data.itemId, message.data);
          render();
        }
        if (message.type === "browser.audio.error") {
          renderAudioError(message.data);
        }
        if (message.type === "browser.audio.deviceChange") {
          state.audio.devices = message.data.devices ?? [];
          state.audio.selectedDeviceId = message.data.selectedDeviceId;
          renderMicSelector();
        }
        if (message.type === "voice.session.start") {
          dlog("voice.session.start.received", { conversationStatus: state.status.conversation, audioReady: state.audio.ready });
          if (!state.voice.sessionInFlight) {
            state.voice.sessionInFlight = true;
            sendMessage("voice.session.requested");
          }
        }
        if (message.type === "voice.session.token") {
          dlog("voice.session.token.received", { hasClientSecret: !!message.data?.clientSecret, model: message.data?.model, expiresAt: message.data?.expiresAt });
          establishVoiceSession(message.data).catch((error) => {
            dlog("establishVoiceSession.unhandled", { message: error?.message, stack: error?.stack });
            failVoice("VOICE_SETUP_FAILED", error?.message ?? String(error));
          });
        }
        if (message.type === "voice.session.close") {
          teardownVoice();
        }
        if (message.type === "voice.send") {
          forwardVoiceSend(message.data?.event, message.data?.gate);
        }
        // audio.output.delta is broadcast by the daemon for visualizer use
        // only — playback is driven directly by the xAI WS message handler in
        // establishVoiceSession (single authoritative playback path; no
        // double-play). We deliberately ignore audio data here.
        if (message.type === "wait_for_context.start") {
          startMetronome();
        }
        if (message.type === "wait_for_context.end") {
          stopMetronome();
        }
      }

      // ──────────────────────────────────────────────────────────────────────
      // Wait-for-context metronome: a gentle click every 2s while the agent
      // is paused waiting for new <context>/<topics> from the orchestrator.
      // ──────────────────────────────────────────────────────────────────────
      const metronome = { ctx: undefined, timer: undefined };

      function startMetronome() {
        if (metronome.timer) return;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!metronome.ctx) metronome.ctx = new Ctx();
        if (metronome.ctx.state === "suspended") {
          metronome.ctx.resume().catch((error) => {
            dlog("metronome.resume.failed", { message: String(error?.message ?? error) });
          });
        }
        const click = () => {
          const ctx = metronome.ctx;
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = 880;
          const now = ctx.currentTime;
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.05, now + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
          osc.connect(gain).connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        };
        click();
        metronome.timer = setInterval(click, 2000);
      }

      function stopMetronome() {
        if (metronome.timer) {
          clearInterval(metronome.timer);
          metronome.timer = undefined;
        }
      }

      async function refreshAudio() {
        if (!navigator.mediaDevices?.getUserMedia) return;
        try {
          const probe = await navigator.mediaDevices.getUserMedia({ audio: true });
          probe.getTracks().forEach((track) => track.stop());
          const devices = (await navigator.mediaDevices.enumerateDevices())
            .filter((device) => device.kind === "audioinput")
            .map((device) => ({ deviceId: device.deviceId, label: device.label || "Microphone", groupId: device.groupId }));
          const previous = state.audio.selectedDeviceId;
          const selected = devices.find((device) => device.deviceId === previous)?.deviceId ?? devices[0]?.deviceId;
          state.audio = { permission: "granted", devices, selectedDeviceId: selected, ready: true };
          sendMessage("audio.device.state", state.audio);
          renderMicSelector();
        } catch (error) {
          const details = {
            code: "MICROPHONE_DEVICE_ERROR",
            message: "Could not access the selected microphone.",
            suggestedAction: "Allow microphone access and try again.",
          };
          sendMessage("browser.audio.error", details);
          renderAudioError(details);
        }
      }

      async function acquireMicStream(deviceId) {
        const audio = {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        };
        if (deviceId) audio.deviceId = { exact: deviceId };
        return navigator.mediaDevices.getUserMedia({ audio });
      }

      function startMeters(stream) {
        if (state.voice.analyserCtx) {
          try {
            state.voice.analyserCtx.close();
          } catch (error) {
            dlog("startMeters.analyserCtx.close.failed", { message: String(error?.message ?? error) });
          }
        }
        const audioCtx = new AudioContext();
        if (audioCtx.state === "suspended") {
          audioCtx.resume().catch((error) => {
            dlog("startMeters.audioCtx.resume.failed", { message: String(error?.message ?? error) });
          });
        }
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        audioCtx.createMediaStreamSource(stream).connect(analyser);
        state.voice.analyser = analyser;
        state.voice.analyserCtx = audioCtx;
        if (state.voice.metersStarted) return;
        state.voice.metersStarted = true;
        const data = new Uint8Array(analyser.frequencyBinCount);
        const bars = [...meters.querySelectorAll(".bar")];
        function updateBars() {
          const current = state.voice.analyser;
          if (current) {
            current.getByteFrequencyData(data);
            bars.forEach((bar, index) => {
              bar.style.setProperty("--level", Math.max(0.1, data[index * 10] / 255));
            });
          }
          requestAnimationFrame(updateBars);
        }
        updateBars();
      }

      function startConversation() {
        if (state.voice.sessionInFlight || state.voice.xaiWs) return;
        if (!state.audio.ready) {
          renderAudioError({
            code: "MICROPHONE_NOT_READY",
            message: "Microphone is not ready.",
            suggestedAction: "Grant microphone access and try again.",
          });
          return;
        }
        state.voice.sessionInFlight = true;
        sendMessage("conversation.start");
        sendMessage("voice.session.requested");
      }

      // RFC 6455 §4.1: Sec-WebSocket-Protocol values must be RFC 7230 token
      // characters. Base64 standard chars '=', '/', '+' are outside that set
      // and would cause the browser to silently reject the WS handshake.
      const SUBPROTOCOL_SAFE = /^[A-Za-z0-9!#$%&'*+\-.^_`|~]+$/;

      function sanitizeSubprotocolToken(token) {
        if (SUBPROTOCOL_SAFE.test(token)) return token;
        const unsafe = [...new Set(token.split('').filter((c) => !SUBPROTOCOL_SAFE.test(c)))].join('');
        // Log the character set (NOT the token value) for diagnostics.
        dlog("voice.session.token.sanitized", { unsafeChars: unsafe });
        return btoa(token).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
      }

      function bytesToBase64Buf(uint8) {
        let binary = "";
        const chunkSize = 0x8000;
        for (let i = 0; i < uint8.length; i += chunkSize) {
          binary += String.fromCharCode.apply(null, uint8.subarray(i, i + chunkSize));
        }
        return btoa(binary);
      }

      function float32ToPcm16Base64(float32) {
        const pcm = new Int16Array(float32.length);
        for (let i = 0; i < float32.length; i += 1) {
          let s = Math.max(-1, Math.min(1, float32[i]));
          pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        return bytesToBase64Buf(new Uint8Array(pcm.buffer));
      }

      function pcm16Base64ToFloat32(b64) {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        const view = new DataView(bytes.buffer);
        const samples = new Float32Array(bytes.length / 2);
        for (let i = 0; i < samples.length; i += 1) {
          const s = view.getInt16(i * 2, true);
          samples[i] = s < 0 ? s / 0x8000 : s / 0x7fff;
        }
        return samples;
      }

      function playPcmDelta(b64) {
        try {
          const samples = pcm16Base64ToFloat32(b64);
          if (samples.length === 0) return;
          let ctx = state.voice.outputCtx;
          if (!ctx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            ctx = new Ctx({ sampleRate: 48000 });
            state.voice.outputCtx = ctx;
          }
          if (ctx.state === "suspended") {
            ctx.resume().catch((error) => {
              dlog("outputCtx.resume.failed", { message: String(error?.message ?? error) });
            });
          }
          const buffer = ctx.createBuffer(1, samples.length, 48000);
          buffer.copyToChannel(samples, 0);
          const source = ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(ctx.destination);
          const now = ctx.currentTime;
          const startAt = Math.max(now, state.voice.nextPlaybackTime);
          source.start(startAt);
          const endsAt = startAt + buffer.duration;
          state.voice.nextPlaybackTime = endsAt;
          state.voice.playbackEndsAt = Math.max(state.voice.playbackEndsAt || 0, endsAt);
          source.addEventListener("ended", checkPlaybackDrained);
        } catch (error) {
          sendMessage("browser.audio.error", {
            code: "AUDIO_DECODE_FAILED",
            message: String(error?.message ?? error),
            suggestedAction: "Refresh the page; if the problem persists check audio device permissions.",
          });
        }
      }

      async function establishVoiceSession(token) {
        dlog("establishVoiceSession.enter", { hasToken: !!token, hasClientSecret: !!token?.clientSecret, model: token?.model, expiresAt: token?.expiresAt });
        if (!token?.clientSecret || !token?.model) {
          failVoice("VOICE_TOKEN_INVALID", "Missing client secret or model.");
          return;
        }
        if (state.voice.xaiWs) {
          dlog("establishVoiceSession.skip", { reason: "xaiWs already exists" });
          return;
        }
        // Pre-expiry re-mint: if we are within 5s of token expiry, request a
        // fresh token before opening the WS instead of racing the boundary.
        if (typeof token.expiresAt === "number" && Date.now() > token.expiresAt * 1000 - 5000) {
          dlog("voice.session.token.preExpiry", { expiresAt: token.expiresAt });
          sendMessage("voice.session.requested");
          return;
        }
        state.voice.tokenExpiresAt = token.expiresAt;

        try {
          const stream = await acquireMicStream(state.audio.selectedDeviceId);
          state.voice.micStream = stream;
          const track = stream.getAudioTracks()[0];
          state.voice.micTrack = track;
          startMeters(stream);

          // Start mic encoder IMMEDIATELY (in parallel with WS connect) so we
          // never miss the user's opening utterance. Frames captured before WS
          // open are buffered in state.voice.preOpenAudio and flushed AFTER the
          // session.update lands (which declares the 48 kHz PCM format) — order
          // matters: a server-side audio buffer interpreted under the default
          // 24 kHz rate would garble the input.
          state.voice.preOpenAudio = [];
          await startMicEncoder(stream);

          const safeToken = sanitizeSubprotocolToken(token.clientSecret);
          // xAI tokens may be JWT-style (base64url) — already subprotocol-safe;
          // sanitization is a defensive no-op in that case but surfaces format
          // changes if xAI alters the token alphabet.
          const ws = new WebSocket(
            `wss://api.x.ai/v1/realtime?model=${encodeURIComponent(token.model)}`,
            [`xai-client-secret.${safeToken}`],
          );
          state.voice.xaiWs = ws;

          ws.addEventListener("open", () => {
            dlog("xaiWs.open", { readyState: ws.readyState, queuedAudioFrames: state.voice.preOpenAudio.length });
            state.voice.xaiOpen = true;
            // 1) Flush pendingSends first — this is where the daemon's
            //    session.update lives (declaring the 48 kHz PCM format).
            //    Per the xAI doc, session.update MUST precede any
            //    input_audio_buffer.append, otherwise the server interprets
            //    audio under the 24 kHz default and the input is garbled.
            for (const payload of state.voice.pendingSends) {
              try { ws.send(payload); } catch (error) {
                dlog("xaiWs.send.pending.failed", { message: String(error?.message ?? error) });
              }
            }
            state.voice.pendingSends = [];
            // 2) Drain buffered mic audio captured before WS open.
            for (const b64 of state.voice.preOpenAudio) {
              try { ws.send(JSON.stringify({ type: "input_audio_buffer.append", audio: b64 })); }
              catch (error) { dlog("xaiWs.send.preOpenAudio.failed", { message: String(error?.message ?? error) }); }
            }
            state.voice.preOpenAudio = [];
            if (!state.voice.connectedSent) {
              state.voice.connectedSent = true;
              state.voice.sessionInFlight = false;
              sendMessage("voice.session.connected");
            }
          });

          ws.addEventListener("message", (event) => {
            let parsed;
            try { parsed = JSON.parse(event.data); } catch (e) {
              dlog("xaiWs.in.parseError", { dataPrefix: String(event.data).slice(0, 200) });
              return;
            }
            if (parsed?.type === "response.created") {
              state.realtime.responseActive = true;
              setThinking(false);
            } else if (parsed?.type === "response.done" || parsed?.type === "response.cancelled" || parsed?.type === "response.failed") {
              state.realtime.responseActive = false;
            }
            if (parsed?.type === "response.cancelled") {
              // Barge-in / cancel: drop any deferred (gated) sends since the
              // user has already started a new turn — a stale post-tool
              // response.create would replay the previous turn's intent.
              state.voice.deferredSends = [];
              setThinking(false);
            }
            // output_audio_buffer.{started,stopped,cleared} are WebRTC/SIP only —
            // not emitted on the WS path. The pending pause cut is driven by a
            // bounded timer in applyPauseState instead.
            // Forward every event to the daemon for transcript/tool wiring.
            sendMessage("voice.event", { event: parsed });
            // Single authoritative playback path: decode + play PCM deltas
            // directly from the xAI WS message. The daemon's audio.output.delta
            // relay is for visualizer data only and is ignored for playback.
            if (parsed?.type === "response.output_audio.delta" && typeof parsed.delta === "string" && !state.voice.paused) {
              playPcmDelta(parsed.delta);
            }
          });

          // Capture close-event details for the onerror message — close fires
          // after error for handshake rejections, giving us code + reason.
          let lastCloseCode = undefined;
          let lastCloseReason = "";

          ws.addEventListener("close", (event) => {
            dlog("xaiWs.close", { code: event.code, reason: event.reason });
            lastCloseCode = event.code;
            lastCloseReason = event.reason;
            state.voice.xaiOpen = false;
            if (!state.voice.connectedSent) {
              failVoice("VOICE_WS_REJECTED", `xAI WS closed before open: code=${event.code} reason=${event.reason}`);
            } else {
              // Mid-session close — surface as session failure.
              sendMessage("voice.session.failed", { error: { code: "VOICE_WS_CLOSED", message: `xAI WS closed: code=${event.code}` } });
              teardownVoice();
            }
          });

          ws.addEventListener("error", () => {
            dlog("xaiWs.error", { lastCloseCode, lastCloseReason });
            // CORS / handshake rejection: the browser delivers minimal info
            // in the error event. Build a descriptive message from what we
            // know: what was attempted (URL scheme+host, subprotocol prefix)
            // and any close-event details that arrived before the error.
            if (!state.voice.connectedSent) {
              const closeInfo = lastCloseCode !== undefined
                ? ` WS close code=${lastCloseCode}${lastCloseReason ? ` reason="${lastCloseReason}"` : ""}.`
                : " No close frame received before error.";
              failVoice(
                "VOICE_WS_REJECTED",
                `xAI WebSocket handshake failed. Attempted: wss://api.x.ai/v1/realtime with subprotocol prefix "xai-client-secret" (token not logged).${closeInfo} Possible causes: CORS policy, invalid/expired token, wrong subprotocol format, or origin not allowlisted.`,
              );
            }
          });
        } catch (error) {
          dlog("establishVoiceSession.catch", { message: error?.message, name: error?.name, stack: error?.stack });
          failVoice("VOICE_SETUP_FAILED", error?.message ?? String(error));
        }
      }

      // AudioWorklet PCM16 encoder: runs off the main thread, emits 100 ms
      // chunks (4800 samples @ 48 kHz mono). Defined inline via a Blob URL so
      // the single-file UI is preserved.
      const PCM16_WORKLET_SRC = `
        class Pcm16Encoder extends AudioWorkletProcessor {
          constructor() { super(); this.buf = []; this.target = 4800; }
          process(inputs) {
            const ch = inputs[0] && inputs[0][0];
            if (!ch) return true;
            this.buf.push(new Float32Array(ch));
            let total = 0;
            for (const b of this.buf) total += b.length;
            while (total >= this.target) {
              const out = new Int16Array(this.target);
              let written = 0;
              while (written < this.target) {
                const head = this.buf[0];
                const take = Math.min(head.length, this.target - written);
                for (let i = 0; i < take; i++) {
                  const s = Math.max(-1, Math.min(1, head[i]));
                  out[written + i] = s < 0 ? s * 0x8000 : s * 0x7fff;
                }
                if (take === head.length) this.buf.shift();
                else this.buf[0] = head.subarray(take);
                written += take;
              }
              total -= this.target;
              this.port.postMessage(out.buffer, [out.buffer]);
            }
            return true;
          }
        }
        registerProcessor("pcm16-encoder", Pcm16Encoder);
      `;

      async function startMicEncoder(stream) {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          const ctx = new Ctx({ sampleRate: 48000 });
          state.voice.inputCtx = ctx;
          if (ctx.state === "suspended") {
            ctx.resume().catch((error) => dlog("inputCtx.resume.failed", { message: String(error?.message ?? error) }));
          }
          const source = ctx.createMediaStreamSource(stream);
          state.voice.micSourceNode = source;
          const blob = new Blob([PCM16_WORKLET_SRC], { type: "application/javascript" });
          const url = URL.createObjectURL(blob);
          try {
            await ctx.audioWorklet.addModule(url);
          } finally {
            URL.revokeObjectURL(url);
          }
          const node = new AudioWorkletNode(ctx, "pcm16-encoder");
          state.voice.workletNode = node;
          node.port.onmessage = (event) => {
            if (state.voice.paused) return;
            try {
              const b64 = bytesToBase64Buf(new Uint8Array(event.data));
              const ws = state.voice.xaiWs;
              if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "input_audio_buffer.append", audio: b64 }));
              } else {
                // Pre-open: buffer with a bounded cap to keep memory tame in
                // case WS open is unusually delayed (e.g. slow handshake).
                state.voice.preOpenAudio.push(b64);
                if (state.voice.preOpenAudio.length > 50) state.voice.preOpenAudio.shift();
              }
            } catch (error) {
              sendMessage("browser.audio.error", {
                code: "AUDIO_ENCODE_FAILED",
                message: String(error?.message ?? error),
                suggestedAction: "Refresh the page; if the problem persists check microphone permissions.",
              });
            }
          };
          // Intentional: do NOT connect node to ctx.destination — the encoder
          // is a pure tap, output goes via postMessage. Connecting to
          // destination would echo mic input to the local speakers.
          source.connect(node);
        } catch (error) {
          dlog("startMicEncoder.failed", { message: String(error?.message ?? error) });
          sendMessage("browser.audio.error", {
            code: "AUDIO_ENCODER_INIT_FAILED",
            message: String(error?.message ?? error),
            suggestedAction: "Try a different browser or device.",
          });
        }
      }

      function forwardVoiceSend(event, gate) {
        if (!event) return;
        if (gate === "playback-drained" && !isPlaybackDrained()) {
          state.voice.deferredSends.push(event);
          setThinking(true);
          return;
        }
        const payload = JSON.stringify(event);
        const ws = state.voice.xaiWs;
        if (ws && state.voice.xaiOpen) {
          try {
            ws.send(payload);
          } catch (error) {
            dlog("xaiWs.send.failed.requeue", { message: String(error?.message ?? error) });
            state.voice.pendingSends.push(payload);
          }
          return;
        }
        state.voice.pendingSends.push(payload);
      }

      function isPlaybackDrained() {
        const ctx = state.voice.outputCtx;
        const endsAt = state.voice.playbackEndsAt;
        if (!endsAt) return true;
        if (!ctx) return true;
        return ctx.currentTime >= endsAt - 0.01;
      }

      function checkPlaybackDrained() {
        if (!isPlaybackDrained()) return;
        // Flush any sends gated on playback completion.
        const ws = state.voice.xaiWs;
        if (state.voice.deferredSends.length === 0) {
          setThinking(false);
          return;
        }
        if (ws && state.voice.xaiOpen) {
          for (const event of state.voice.deferredSends) {
            try { ws.send(JSON.stringify(event)); }
            catch (error) { dlog("xaiWs.send.deferred.failed", { message: String(error?.message ?? error) }); }
          }
          state.voice.deferredSends = [];
        }
        setThinking(false);
      }

      function setThinking(visible) {
        const node = $("thinking");
        if (node) node.hidden = !visible;
      }

      function failVoice(code, message) {
        dlog("failVoice", { code, message });
        sendMessage("voice.session.failed", { error: { code, message } });
        teardownVoice();
      }

      function teardownVoice() {
        const { xaiWs, micStream, analyserCtx, workletNode, micSourceNode, inputCtx, outputCtx } = state.voice;
        if (xaiWs) {
          try { xaiWs.close(); } catch (error) { dlog("teardown.xaiWs.close.failed", { message: String(error?.message ?? error) }); }
        }
        if (workletNode) {
          try {
            workletNode.port.onmessage = null;
            workletNode.disconnect();
          } catch (error) { dlog("teardown.worklet.disconnect.failed", { message: String(error?.message ?? error) }); }
        }
        if (micSourceNode) {
          try { micSourceNode.disconnect(); } catch (error) { dlog("teardown.micSource.disconnect.failed", { message: String(error?.message ?? error) }); }
        }
        if (inputCtx) {
          try { inputCtx.close(); } catch (error) { dlog("teardown.inputCtx.close.failed", { message: String(error?.message ?? error) }); }
        }
        if (outputCtx) {
          try { outputCtx.close(); } catch (error) { dlog("teardown.outputCtx.close.failed", { message: String(error?.message ?? error) }); }
        }
        if (micStream) {
          micStream.getTracks().forEach((track) => track.stop());
        }
        if (analyserCtx) {
          try { analyserCtx.close(); } catch (error) { dlog("teardown.analyserCtx.close.failed", { message: String(error?.message ?? error) }); }
        }
        state.voice.xaiWs = undefined;
        state.voice.xaiOpen = false;
        state.voice.connectedSent = false;
        state.voice.micStream = undefined;
        state.voice.micTrack = undefined;
        state.voice.micSourceNode = undefined;
        state.voice.workletNode = undefined;
        state.voice.inputCtx = undefined;
        state.voice.outputCtx = undefined;
        state.voice.nextPlaybackTime = 0;
        state.voice.playbackEndsAt = 0;
        state.voice.analyser = undefined;
        state.voice.analyserCtx = undefined;
        state.voice.pendingSends = [];
        state.voice.preOpenAudio = [];
        state.voice.deferredSends = [];
        state.voice.sessionInFlight = false;
        state.voice.tokenExpiresAt = 0;
        state.voice.paused = false;
        setThinking(false);
      }

      function applyPauseState(status, previousStatus) {
        const paused = status === "paused";
        const { micTrack, xaiWs, xaiOpen } = state.voice;
        if (paused) {
          // If a response is currently being spoken, defer the audio cut by a
          // short bounded timer (output_audio_buffer.stopped is WebRTC/SIP only
          // and never fires on the WS path). Stop the mic immediately so the
          // model cannot pick up more input during the wind-down.
          if (state.realtime.responseActive) {
            state.realtime.pendingPauseCut = true;
            state.voice.paused = true;
            if (micTrack) micTrack.enabled = false;
            setTimeout(() => {
              if (state.realtime.pendingPauseCut) {
                state.realtime.pendingPauseCut = false;
                applyPauseAudioCut();
              }
            }, 500);
            return;
          }
          applyPauseAudioCut();
        } else if (status === "active") {
          // Resuming: clear deferred pause-cut, re-enable mic.
          state.realtime.pendingPauseCut = false;
          state.voice.paused = false;
          if (micTrack) micTrack.enabled = true;
          // previousStatus retained as parameter for symmetry with the
          // controller's pause/resume contract.
          void previousStatus;
          // Resume output context if it was suspended.
          if (state.voice.outputCtx?.state === "suspended") {
            state.voice.outputCtx.resume().catch((error) => {
              dlog("outputCtx.resume.failed", { message: String(error?.message ?? error) });
            });
          }
          if (xaiWs && xaiOpen) {
            // No explicit "resume" event in xAI's protocol — turn detection
            // resumes naturally as mic frames flow again.
          }
        }
      }

      // Applies the actual audio-pause side effects: pause output context,
      // stop mic capture, cancel any in-flight response.
      function applyPauseAudioCut() {
        const { micTrack, xaiWs, xaiOpen, outputCtx } = state.voice;
        state.voice.paused = true;
        if (micTrack) micTrack.enabled = false;
        if (outputCtx?.state === "running") {
          outputCtx.suspend().catch((error) => {
            dlog("outputCtx.suspend.failed", { message: String(error?.message ?? error) });
          });
        }
        if (xaiWs && xaiOpen && state.realtime.responseActive) {
          try { xaiWs.send(JSON.stringify({ type: "response.cancel" })); }
          catch (error) { dlog("xaiWs.send.responseCancel.failed", { message: String(error?.message ?? error) }); }
        }
      }

      async function switchMicDevice(deviceId) {
        state.audio.selectedDeviceId = deviceId;
        sendMessage("audio.device.select", { deviceId });
        if (!state.voice.xaiWs) return;
        try {
          const stream = await acquireMicStream(deviceId);
          // Tear down the existing mic encoder pipeline and rebuild it on the
          // new stream. The xAI WS stays open; only the mic capture changes.
          if (state.voice.workletNode) {
            try {
              state.voice.workletNode.port.onmessage = null;
              state.voice.workletNode.disconnect();
            } catch (error) { dlog("switchMic.worklet.disconnect.failed", { message: String(error?.message ?? error) }); }
            state.voice.workletNode = undefined;
          }
          if (state.voice.micSourceNode) {
            try { state.voice.micSourceNode.disconnect(); } catch (error) { dlog("switchMic.micSource.disconnect.failed", { message: String(error?.message ?? error) }); }
          }
          if (state.voice.inputCtx) {
            try { state.voice.inputCtx.close(); } catch (error) { dlog("switchMic.inputCtx.close.failed", { message: String(error?.message ?? error) }); }
            state.voice.inputCtx = undefined;
          }
          if (state.voice.micStream) {
            state.voice.micStream.getTracks().forEach((existing) => existing.stop());
          }
          state.voice.micStream = stream;
          state.voice.micTrack = stream.getAudioTracks()[0];
          await startMicEncoder(stream);
          startMeters(stream);
        } catch (error) {
          renderAudioError({
            code: "MICROPHONE_SWITCH_FAILED",
            message: error?.message ?? "Could not switch microphone.",
            suggestedAction: "Try a different device.",
          });
        }
      }

      function bytesToBase64(bytes) {
        let binary = "";
        for (let i = 0; i < bytes.length; i += 1) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      }

      function base64ToBytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function render() {
        const status = state.status.conversation;
        primary.className = "primary";
        primary.disabled = !["none", "active", "paused"].includes(status);
        primary.textContent =
          status === "active" ? "Pause" :
          status === "paused" ? "Resume" :
          status === "starting" ? "Starting…" :
          "Start";
        primary.setAttribute("aria-label", `${primary.textContent} conversation`);
        if (status === "active") primary.classList.add("pause");
        if (status === "paused") primary.classList.add("resume");
        reset.classList.toggle("hidden", !["active", "paused"].includes(status));
        download.disabled = (state.conversation?.transcript ?? []).length === 0;
        meters.classList.toggle("hidden", status !== "active" || !state.audio.ready);
        renderTranscript();
      }

      function downloadTranscript() {
        const items = state.conversation?.transcript ?? [];
        if (items.length === 0) return;
        const jsonl = items.map((item) => JSON.stringify(item)).join("\n") + "\n";
        const blob = new Blob([jsonl], { type: "application/jsonl" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        const stamp = new Date().toISOString().replace(/[:.]/g, "-");
        const convId = state.conversation?.id ?? "conversation";
        anchor.href = url;
        anchor.download = `transcript-${convId}-${stamp}.jsonl`;
        document.body.append(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
      }

      function renderTranscript() {
        transcript.innerHTML = "";
        const conversation = state.conversation;
        if (!conversation) {
          transcript.innerHTML =
            '<div class="empty-state"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2v20M5 8v8M19 8v8"/></svg><div>Ready to start</div></div>';
          return;
        }
        if (conversation.status === "ended") {
          transcript.innerHTML = '<div class="ended-state"><strong>Conversation ended</strong><span>Transcript is no longer active.</span></div>';
          return;
        }
        const byTranscript = new Map((conversation.transcript ?? []).map((item) => [item.id, item]));
        const byTool = new Map((conversation.toolCalls ?? []).map((item) => [item.id, item]));
        for (const entry of conversation.timeline ?? []) {
          if (entry.type === "transcript") renderTranscriptItem(byTranscript.get(entry.transcriptItemId));
          if (entry.type === "toolCall") renderToolCall(byTool.get(entry.toolCallId));
        }
        for (const draft of state.streamDrafts.values()) {
          if (byTranscript.has(draft.itemId)) continue;
          renderTranscriptItem({
            id: draft.itemId,
            role: draft.role ?? "assistant",
            source: draft.source ?? "assistantAudio",
            text: draft.fullTextSoFar,
            streaming: true,
          });
        }
        maybeScrollToBottom();
      }

      function renderTranscriptItem(item) {
        if (!item) return;
        const node = document.createElement("article");
        node.className = `transcript-item role-${item.role} source-${item.source}`;
        if (item.streaming) node.classList.add("streaming");
        node.textContent = item.text;
        transcript.append(node);
      }

      function clearFinalizedDrafts() {
        const finalized = new Set((state.conversation?.transcript ?? []).map((item) => item.id));
        for (const itemId of state.streamDrafts.keys()) {
          if (finalized.has(itemId)) state.streamDrafts.delete(itemId);
        }
      }

      function renderToolCall(tool) {
        if (!tool) return;
        const node = document.createElement("article");
        node.className = "tool-call";
        node.tabIndex = 0;
        node.innerHTML = `<div class="tool-row"><span class="toggle">▸</span><span>Tool: ${escapeText(tool.toolName)}(...)</span><span class="badge ${tool.status}">${tool.status}</span></div><div class="tool-call-body"><div class="section-label">ARGUMENTS</div><pre>${escapeText(JSON.stringify(tool.arguments, null, 2))}</pre><div class="section-label">RESULT</div><pre>${escapeText(JSON.stringify(tool.result ?? tool.error ?? null, null, 2))}</pre></div>`;
        const toggle = () => {
          node.classList.toggle("expanded");
          const body = node.querySelector(".tool-call-body");
          node.style.setProperty("--body-height", `${body.scrollHeight}px`);
          node.querySelector(".toggle").textContent = node.classList.contains("expanded") ? "▾" : "▸";
        };
        node.addEventListener("click", toggle);
        node.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") toggle();
        });
        transcript.append(node);
      }

      function renderMicSelector() {
        if (!state.audio.ready) return;
        micArea.innerHTML = '<label class="field-label" for="micSelect">Microphone</label><select id="micSelect"></select>';
        const select = micArea.querySelector("#micSelect");
        if (!select) return;
        for (const device of state.audio.devices) {
          const option = document.createElement("option");
          option.value = device.deviceId;
          option.textContent = device.label;
          option.selected = device.deviceId === state.audio.selectedDeviceId;
          select.append(option);
        }
        select.addEventListener("change", () => switchMicDevice(select.value));
      }

      function renderAudioError(error) {
        micArea.innerHTML = `<div class="error-block"><div class="error-title">Microphone error</div><div>${escapeText(error.message)}</div><div><strong>Reason:</strong> ${escapeText(error.code)}</div><div><strong>Suggested action:</strong> ${escapeText(error.suggestedAction)}</div><button class="retry" type="button">Retry</button></div>`;
        micArea.querySelector("button").addEventListener("click", refreshAudio);
      }

      function sendText() {
        const text = textInput.value.trim();
        if (!text) return;
        sendMessage("message.text", { text });
        textInput.value = "";
        textInput.dispatchEvent(new Event("input"));
      }

      function sendMessage(type, data) {
        if (type !== "browser.debug") dlog("ws.out", { type, data });
        if (state.ws?.readyState === WebSocket.OPEN) state.ws.send(JSON.stringify({ type, data }));
      }

      function dlog(label, info) {
        // dlog is called from every code path; if logging itself throws
        // (e.g. WS in odd state, JSON.stringify on a circular ref), we must
        // not propagate — that would surface as a fatal in unrelated callers.
        try {
          const payload = { label, info, t: Date.now() };
          console.log("[dbg]", label, info);
          if (state.ws?.readyState === WebSocket.OPEN) {
            state.ws.send(JSON.stringify({ type: "browser.debug", data: payload }));
          }
        } catch (error) {
          console.error("dlog itself threw", error);
        }
      }

      function voiceSnapshot() {
        const { xaiWs } = state.voice;
        return {
          sessionInFlight: state.voice.sessionInFlight,
          xaiOpen: state.voice.xaiOpen,
          connectedSent: state.voice.connectedSent,
          hasMicTrack: !!state.voice.micTrack,
          ws: xaiWs ? { readyState: xaiWs.readyState } : null,
        };
      }

      window.addEventListener("error", (e) => dlog("window.error", { message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno }));
      window.addEventListener("unhandledrejection", (e) => dlog("window.unhandledrejection", { reason: String(e.reason), stack: e.reason?.stack }));

      function setConnection(status) {
        dot.className = `dot ${status}`;
        connectionLabel.textContent =
          status === "connected" ? "Connected" : status === "connecting" ? "Connecting..." : status === "error" ? "Connection Error" : "Disconnected";
      }

      function maybeScrollToBottom() {
        if (state.atBottom) transcript.scrollTop = transcript.scrollHeight;
      }

      function escapeText(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      }
    </script>
  </body>
</html>
