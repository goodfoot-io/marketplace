version: '3.8'

volumes:
  db_storage_pg18:

services:
  app:
    init: true
    cap_add:
      # Tailscale runs in TUN mode (real interface) so MagicDNS works system-wide.
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      # Persist the user's home (claude config, shell history, tool caches,
      # Tailscale state under ~/.local/share/tailscale) across rebuilds.
      - ${HOME}/devcontainer/marketplace:/home/node:cached
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_OPTIONS=--max-old-space-size=8192
      - CLAUDE_CONFIG_DIR=/home/node/.claude
    # No dns: pin — `tailscale up --accept-dns` manages /etc/resolv.conf
    # (MagicDNS at 100.100.100.100, with split-DNS to upstreams).
    command: sleep infinity

  postgres:
    image: postgres:18.1
    restart: "no"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - db_storage_pg18:/var/lib/postgresql
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    ports:
      - "54322:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10